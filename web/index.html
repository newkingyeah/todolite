<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#fcfcfd" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0b0b10" media="(prefers-color-scheme: dark)" />
<title>ToDo</title>
<link rel="icon" href="/favicon.ico" sizes="32x32" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="stylesheet" href="/styles.css" />
<style id="custom-css"></style>
</head>
<body>
<div id="root"></div>
<script>
  // 调试用：?today=2026-11-20 让整个看板以为今天是那一天（只改前端，数据不动）。
  // 时有时无地要验证“周五的打卡表”“某天到期的事”时用，不加参数就完全无影响。
  (() => {
    const q = new URLSearchParams(location.search).get("today");
    if (!q || !/^\d{4}-\d{2}-\d{2}$/.test(q)) return;
    const [y, m, d] = q.split("-").map(Number);
    if (!y || !m || !d) return;
    const RealDate = Date, real = new RealDate();
    const target = new RealDate(y, m - 1, d, real.getHours(), real.getMinutes(), real.getSeconds(), real.getMilliseconds());
    if (Number.isNaN(target.getTime())) return;
    const offset = target.getTime() - real.getTime();
    class ShiftedDate extends RealDate {
      constructor(...a) { if (a.length === 0) super(RealDate.now() + offset); else super(...a); }
      static now() { return RealDate.now() + offset; }
    }
    window.Date = ShiftedDate;
    document.documentElement.dataset.today = q;
  })();
</script>
<script type="module" src="/main.js"></script>
</body>
</html>
